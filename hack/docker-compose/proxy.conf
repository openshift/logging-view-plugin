server {
  listen 80 default_server;
  server_name _;
  server_name_in_redirect off;
  access_log  /dev/stdout;
  error_log  /dev/stderr debug;

  # Artificial query latency (seconds). Set to 0 to disable.
  # Change this single value to make queries slower/faster.
  set $query_delay 0;

  location / {
    access_by_lua_block { ngx.sleep(tonumber(ngx.var.query_delay)) }
    proxy_set_header Host $host;
    proxy_pass http://loki:3100/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /api/logs/v1/application/ {
    access_by_lua_block { ngx.sleep(tonumber(ngx.var.query_delay)) }
    proxy_set_header Host $host;
    proxy_pass http://loki:3100/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /api/logs/v1/audit/ {
    access_by_lua_block { ngx.sleep(tonumber(ngx.var.query_delay)) }
    proxy_set_header Host $host;
    proxy_pass http://loki:3100/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /api/logs/v1/infrastructure/ {
    access_by_lua_block { ngx.sleep(tonumber(ngx.var.query_delay)) }
    proxy_set_header Host $host;
    proxy_pass http://loki:3100/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
